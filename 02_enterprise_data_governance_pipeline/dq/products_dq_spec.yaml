rules:
  - name: sku-not-null
    description: Every catalog product must have a non-null SKU primary identifier
    column: sku
    dimension: COMPLETENESS
    threshold: 1.0
    nonNullExpectation: {}
  - name: sku-unique
    description: Catalog SKU identifiers must be globally unique across products
    column: sku
    dimension: UNIQUENESS
    uniquenessExpectation: {}
  - name: sku-format-pattern
    description: Catalog SKU must follow standard Ingram Micro IM-<VENDOR>-<MODEL> naming convention
    column: sku
    dimension: VALIDITY
    ignoreNull: true
    threshold: 1.0
    regexExpectation:
      regex: '^IM-[A-Z0-9]+-[A-Z0-9]+$'
  - name: positive-list-price
    description: Reseller catalog unit list price (USD) must be strictly positive (>= $1.00)
    column: unit_price_usd
    dimension: VALIDITY
    ignoreNull: true
    threshold: 1.0
    rangeExpectation:
      minValue: '1'
  - name: margin-floor-guardrail
    description: B2B Margin Guardrail — Catalog unit list price must be greater than or equal to wholesale unit cost
    column: unit_price_usd
    dimension: CONSISTENCY
    threshold: 1.0
    rowConditionExpectation:
      sqlExpression: '`unit_price_usd` >= `unit_cost_usd`'
postScanActions:
  bigqueryExport:
    resultsTable: //bigquery.googleapis.com/projects/demo1-371900/datasets/ingram_micro_analytics/tables/dq_scan_results
catalogPublishingEnabled: true
